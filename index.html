<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EduMaster">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <title>EduMaster | Cổng Đăng Nhập Tập Trung</title>
    
    <!-- CSS TĨNH BIÊN DỊCH SẴN - TƯƠNG THÍCH TUYỆT ĐỐI MỌI TRÌNH DUYỆT -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * { 
            font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            -webkit-font-smoothing: antialiased; 
            box-sizing: border-box;
        }
        
        /* BẢO ĐẢM CUỘN TỰ NHIÊN TRÊN ANDROID & IOS */
        html, body {
            min-height: 100%;
            background-color: #0f172a;
            color: #f8fafc;
        }
        
        body { 
            min-height: 100vh;
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-orient: vertical;
            -webkit-box-direction: normal;
            -webkit-flex-direction: column;
            flex-direction: column;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* FALLBACKS & TIỀN TỐ WEBKIT CHO IOS 12 */
        .hidden { display: none !important; }
        .flex { display: -webkit-box !important; display: -webkit-flex !important; display: -ms-flexbox !important; display: flex !important; }
        
        .glass-card { 
            background: rgba(30, 41, 59, 0.7); /* Fallback */
            background: rgba(255, 255, 255, 0.04); 
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        .glass-card:hover { 
            background: rgba(255, 255, 255, 0.08); 
            border-color: rgba(255, 255, 255, 0.2); 
            -webkit-transform: translateY(-5px);
            transform: translateY(-5px); 
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5); 
        }

        .bg-grid { 
            background-size: 40px 40px; 
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px), 
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px); 
        }

        /* TEXT GRADIENT CHUẨN SAFARI VÀ PC */
        .gradient-title {
            background: -webkit-linear-gradient(left, #ffffff, #94a3b8);
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: #ffffff;
        }

        /* TƯƠNG THÍCH MÀU NỀN VÀ KHUNG SLATE CHO IOS 12 */
        .bg-slate-900 { background-color: #0f172a !important; }
        .bg-slate-800 { background-color: #1e293b !important; }
        .bg-slate-800\/50 { background-color: rgba(30, 41, 59, 0.5) !important; }
        .bg-slate-950\/80 { background-color: rgba(2, 6, 23, 0.85) !important; }
        .border-slate-700 { border-color: #334155 !important; }
        .text-slate-400 { color: #94a3b8 !important; }
        .text-slate-500 { color: #64748b !important; }
        .text-slate-600 { color: #475569 !important; }

        input {
            -webkit-appearance: none;
            appearance: none;
            font-size: 16px !important; /* Chống tự phóng to màn hình trên iOS */
        }

        .modal-enter { 
            -webkit-animation: modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation: modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
        }
        @-webkit-keyframes modalIn { 
            from { opacity: 0; -webkit-transform: scale(0.95) translateY(10px); } 
            to { opacity: 1; -webkit-transform: scale(1) translateY(0); } 
        }
        @keyframes modalIn { 
            from { opacity: 0; transform: scale(0.95) translateY(10px); } 
            to { opacity: 1; transform: scale(1) translateY(0); } 
        }
    </style>
</head>
<body class="relative">
    
    <!-- Background Vô Cực -->
    <div class="fixed inset-0 bg-grid pointer-events-none"></div>
    <div class="fixed top-1/4 left-1/4 w-96 h-96 bg-blue-600 opacity-20 rounded-full filter blur-3xl pointer-events-none"></div>
    <div class="fixed bottom-1/4 right-1/4 w-96 h-96 bg-indigo-600 opacity-20 rounded-full filter blur-3xl pointer-events-none"></div>

    <!-- Đã sửa: Thay gap-3 bằng space-y-3 để tương thích iOS 12 -->
    <div id="toast-container" class="fixed top-6 right-6 z-50 flex flex-col space-y-3 pointer-events-none"></div>

    <!-- KHUNG CHỨA TRUNG TÂM (TỰ CĂN GIỮA TRÊN PC, CUỘN MƯỢT TRÊN ANDROID) -->
    <div class="relative z-10 w-full max-w-4xl p-4 sm:p-6 my-auto pt-8 pb-16 md:py-12">
        <!-- Logo & Slogan -->
        <div class="text-center mb-8 md:mb-12">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-600 text-white text-3xl font-black shadow-lg mb-4">⚡</div>
            <h1 class="text-3xl md:text-4xl font-black uppercase tracking-widest gradient-title">EduMaster 2025</h1>
            <p class="text-slate-400 mt-2 font-medium tracking-wide text-xs sm:text-sm">HỆ SINH THÁI KHẢO THÍ & ĐÁNH GIÁ NĂNG LỰC TOÀN DIỆN</p>
        </div>

        <!-- Khối Phân Quyền Đăng Nhập -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-3xl mx-auto" id="role-selection">
            <!-- Dành cho Học Sinh -->
            <button onclick="Portal.showStudentLogin()" class="glass-card rounded-3xl p-6 sm:p-8 text-left transition-all duration-300 group relative overflow-hidden focus:outline-none">
                <div class="w-14 h-14 bg-green-500 bg-opacity-20 text-green-400 rounded-2xl flex items-center justify-center text-3xl mb-6 border border-green-500 border-opacity-30">🎓</div>
                <h2 class="text-xl sm:text-2xl font-black text-white mb-2 uppercase tracking-wide">Dành cho Học Sinh</h2>
                <p class="text-slate-400 text-xs sm:text-sm leading-relaxed mb-6 font-medium">Truy cập Sảnh chờ Live Arena, tham gia ca thi, luyện tập tự do và tra cứu bảng điểm cá nhân.</p>
                <!-- Đã sửa: Dùng translate-x-2 thay vì group-hover:gap-2 -->
                <div class="flex items-center text-green-400 text-sm font-bold uppercase tracking-wider transition-all">Vào Sảnh Chờ <span class="ml-1 text-lg transition-transform duration-300 transform group-hover:translate-x-2">→</span></div>
            </button>

            <!-- Dành cho Giáo Viên -->
            <button onclick="Portal.showAdminLogin()" class="glass-card rounded-3xl p-6 sm:p-8 text-left transition-all duration-300 group relative overflow-hidden focus:outline-none">
                <div class="w-14 h-14 bg-blue-500 bg-opacity-20 text-blue-400 rounded-2xl flex items-center justify-center text-3xl mb-6 border border-blue-500 border-opacity-30">👨‍🏫</div>
                <h2 class="text-xl sm:text-2xl font-black text-white mb-2 uppercase tracking-wide">Dành cho Giáo Viên</h2>
                <p class="text-slate-400 text-xs sm:text-sm leading-relaxed mb-6 font-medium">Truy cập Trung tâm Quản trị, tạo đề thi, cấu hình ca thi, giám sát trực tuyến và chấm bài tự luận.</p>
                <!-- Đã sửa: Dùng translate-x-2 thay vì group-hover:gap-2 -->
                <div class="flex items-center text-blue-400 text-sm font-bold uppercase tracking-wider transition-all">Vào Quản Trị <span class="ml-1 text-lg transition-transform duration-300 transform group-hover:translate-x-2">→</span></div>
            </button>
        </div>
    </div>

    <!-- MODAL 1: HỌC SINH (KHÓA ẨN MẶC ĐỊNH BẰNG INLINE STYLE) -->
    <div id="modal-student" style="display: none;" class="fixed inset-0 bg-slate-950/80 z-50 items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-slate-900 border border-slate-700 rounded-3xl p-6 sm:p-8 w-full max-w-md shadow-2xl relative">
            <button onclick="Portal.closeModals()" class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 transition">✕</button>
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-green-500 bg-opacity-20 text-green-400 rounded-full flex items-center justify-center text-3xl mx-auto mb-4 border border-green-500 border-opacity-30">🎓</div>
                <h3 class="text-xl font-black text-white uppercase tracking-wider">Định danh Thí sinh</h3>
                <p class="text-xs text-slate-400 mt-2 font-medium">Hệ thống sẽ ghi nhận thông tin này vào bài làm.</p>
            </div>
            <div class="space-y-4 mb-8">
                <div>
                    <label class="block text-xs font-black text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Họ và Tên</label>
                    <input type="text" id="std-name" placeholder="Nguyễn Văn A" class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-4 py-3.5 outline-none focus:border-green-500 transition placeholder-slate-600 font-bold text-base" onkeypress="if(event.key === 'Enter') document.getElementById('std-class').focus()">
                </div>
                <div>
                    <label class="block text-xs font-black text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Lớp</label>
                    <input type="text" id="std-class" placeholder="Ví dụ: 12A1" class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-4 py-3.5 outline-none focus:border-green-500 transition placeholder-slate-600 font-bold uppercase text-base" onkeypress="if(event.key === 'Enter') Portal.enterArena()">
                </div>
            </div>
            <button onclick="Portal.enterArena()" class="w-full bg-green-600 hover:bg-green-500 text-white font-black py-4 rounded-xl transition uppercase tracking-widest shadow-lg active:scale-95">Mở Sảnh Chờ Arena</button>
        </div>
    </div>

    <!-- MODAL 2: QUẢN TRỊ (KHÓA ẨN MẶC ĐỊNH BẰNG INLINE STYLE) -->
    <div id="modal-admin" style="display: none;" class="fixed inset-0 bg-slate-950/80 z-50 items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-slate-900 border border-slate-700 rounded-3xl p-6 sm:p-8 w-full max-w-md shadow-2xl relative">
            <button onclick="Portal.closeModals()" class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 transition">✕</button>
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-blue-500 bg-opacity-20 text-blue-400 rounded-full flex items-center justify-center text-3xl mx-auto mb-4 border border-blue-500 border-opacity-30">🔒</div>
                <h3 class="text-xl font-black text-white uppercase tracking-wider">Xác thực Quản trị</h3>
                <p class="text-xs text-slate-400 mt-2 font-medium">Chỉ dành cho Giáo viên / Hội đồng khảo thí.</p>
            </div>
            <div class="space-y-4 mb-8">
                <div>
                    <label class="block text-xs font-black text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Mật khẩu truy cập</label>
                    <input type="password" id="adm-pass" placeholder="••••••••" class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-4 py-3.5 outline-none focus:border-blue-500 transition placeholder-slate-600 font-bold tracking-widest text-center text-base" onkeypress="if(event.key === 'Enter') Portal.enterAdmin()">
                </div>
            </div>
            <button onclick="Portal.enterAdmin()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-xl transition uppercase tracking-widest shadow-lg active:scale-95">Đăng Nhập Hệ Thống</button>
        </div>
    </div>

    <!-- HỆ THỐNG LOGIC ĐIỀU HƯỚNG -->
    <script>
        const Utils = {
            toast: (msg, type = 'info') => {
                const c = document.getElementById('toast-container');
                const t = document.createElement('div');
                const col = type === 'error' ? 'bg-red-600 border-red-500' : 'bg-green-600 border-green-500';
                
                // Đã sửa: Thay gap-2 bằng space-x-2
                t.className = `flex items-center space-x-2 ${col} text-white px-5 py-3.5 rounded-2xl shadow-2xl border text-sm font-bold transition-all transform opacity-100`;
                
                t.innerHTML = `<span>${type === 'error' ? '⚠️' : '✅'}</span><span>${msg}</span>`;
                c.appendChild(t);
                
                // Tương thích mượt mà cho cả iOS 12 và trình duyệt hiện đại
                if (typeof t.animate === 'function') {
                    t.animate([{ transform: 'translateY(-20px) scale(0.9)', opacity: 0 }, { transform: 'translateY(0) scale(1)', opacity: 1 }], { duration: 300 });
                    setTimeout(() => { 
                        try {
                            const a = t.animate([{ opacity: 1 }, { opacity: 0, transform: 'translateX(20px)' }], { duration: 300, fill: 'forwards' }); 
                            a.onfinish = () => t.remove(); 
                        } catch(e) { t.remove(); }
                    }, 3000);
                } else {
                    setTimeout(() => { t.remove(); }, 3000);
                }
            }
        };

        const Portal = {
            init() {
                const lastUser = JSON.parse(localStorage.getItem('eduMasterLastUser'));
                if (lastUser && lastUser.name && lastUser.class) {
                    const nameEl = document.getElementById('std-name');
                    const classEl = document.getElementById('std-class');
                    if (nameEl) nameEl.value = lastUser.name;
                    if (classEl) classEl.value = lastUser.class;
                }
            },

            showStudentLogin() {
                const m = document.getElementById('modal-student');
                m.style.display = 'flex';
                m.classList.remove('hidden');
                setTimeout(() => {
                    m.classList.remove('opacity-0');
                    if (m.firstElementChild) m.firstElementChild.classList.add('modal-enter');
                    const input = document.getElementById('std-name');
                    if (input) input.focus();
                }, 20);
            },

            showAdminLogin() {
                const m = document.getElementById('modal-admin');
                m.style.display = 'flex';
                m.classList.remove('hidden');
                setTimeout(() => {
                    m.classList.remove('opacity-0');
                    if (m.firstElementChild) m.firstElementChild.classList.add('modal-enter');
                    const input = document.getElementById('adm-pass');
                    if (input) input.focus();
                }, 20);
            },

            closeModals() {
                ['modal-student', 'modal-admin'].forEach(id => {
                    const m = document.getElementById(id);
                    if (!m) return;
                    m.classList.add('opacity-0');
                    if (m.firstElementChild) m.firstElementChild.classList.remove('modal-enter');
                    setTimeout(() => { 
                        m.classList.add('hidden'); 
                        m.style.display = 'none';
                    }, 300);
                });
            },

            enterArena() {
                const name = document.getElementById('std-name').value.trim();
                const cls = document.getElementById('std-class').value.trim().toUpperCase();
                
                if (!name || !cls) return Utils.toast("Vui lòng điền đủ Họ tên và Lớp!", "error");
                
                localStorage.setItem('eduMasterLastUser', JSON.stringify({ name: name, class: cls }));
                
                document.body.style.opacity = '0';
                document.body.style.transition = 'opacity 0.4s ease';
                setTimeout(() => { window.location.href = 'arena.html'; }, 400);
            },

            enterAdmin() {
                const pass = document.getElementById('adm-pass').value.trim();
                if (pass === 'admin') { 
                    localStorage.setItem('eduMasterAdminAuth', 'true');
                    document.body.style.opacity = '0';
                    document.body.style.transition = 'opacity 0.4s ease';
                    setTimeout(() => { window.location.href = 'admin.html'; }, 400);
                } else {
                    Utils.toast("Sai mật khẩu quản trị!", "error");
                    document.getElementById('adm-pass').value = '';
                }
            }
        };

        window.onload = Portal.init;
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('PWA sẵn sàng'))
                    .catch(err => console.error('Lỗi SW:', err));
            });
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            setTimeout(() => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    deferredPrompt = null;
                }
            }, 2000);
        });
    </script>
</body>
</html>
